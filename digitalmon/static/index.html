<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基尔兽观察台</title><style>body{background:#101722;color:#e6edf5;font:16px/1.8 "Segoe UI","Microsoft YaHei UI",sans-serif;max-width:920px;margin:40px auto;padding:24px}section{background:#192334;padding:24px;border-radius:16px;margin:20px 0}button,input{font:inherit;padding:10px;border-radius:8px;margin:6px}small{color:#9aaac0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>基尔兽观察台</h1><p>基尔兽在电脑桌面活动。这里查看同一个体的记忆、学习和任务记录。</p><section id="login"><input id="key" type="password" placeholder="访问令牌"><button onclick="token=document.getElementById('key').value;sessionStorage.setItem('dm-token',token);refresh()">连接</button></section><section><h2 id="form">基尔兽</h2><div id="summary"></div><button onclick="action('/api/explore',{})">联网探索</button><button onclick="action('/api/control',{action:'pause'})">暂停</button><button onclick="action('/api/control',{action:'resume'})">继续</button><p id="notice"></p></section><section><h2>进化条件与进度</h2><pre id="growth"></pre></section><section><h2>联网探索记录</h2><p><small>显示真实访问结果与保存的内容。读取不等于理解。</small></p><div id="exploration"></div></section><section><h2>最近学习和任务记录</h2><pre id="events"></pre></section><script>
let token=location.hash.slice(1)||sessionStorage.getItem('dm-token')||'';if(location.hash){sessionStorage.setItem('dm-token',token);history.replaceState(null,'',location.pathname)}
async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function action(path,body){try{let r=await api(path,body);document.getElementById('notice').textContent=r.reply||'操作已记录';await refresh()}catch(e){document.getElementById('notice').textContent=e.message}}
async function renderExplorations(){let records=await api('/api/explorations'),box=document.getElementById('exploration');box.replaceChildren();for(let r of records){let article=document.createElement('article'),title=document.createElement('h3'),meta=document.createElement('p'),content=document.createElement('pre'),effect=document.createElement('small');title.textContent=(r.result.title||r.payload.url)+' · '+r.status;meta.textContent=new Date(r.created*1000).toLocaleString()+' · '+(r.result.url||r.payload.url);content.textContent=r.memory?r.memory.text:(r.result.error||'任务尚未完成');content.style.maxHeight='240px';content.style.overflow='auto';effect.textContent=r.effect;article.append(title,meta,content,effect);box.append(article)}if(!records.length)box.textContent='还没有探索记录。'}
async function refresh(){try{let p=await api('/api/pet'),s=await api('/api/state');await renderExplorations();document.getElementById('login').style.display='none';document.getElementById('form').textContent=p.form;document.getElementById('summary').textContent='同一个体 '+s.id+' · 网络更新 '+(p.brain.updates||0)+' 次 · '+(s.paused?'暂停中':'活动中');document.getElementById('growth').textContent=JSON.stringify(p.progress,null,2)+'\n\n'+p.requirements.join('\n');document.getElementById('events').textContent=s.events.filter(e=>e.kind!=='action').slice(0,15).map(e=>new Date(e.ts*1000).toLocaleTimeString()+' '+e.kind+' '+JSON.stringify(e.data)).join('\n\n')}catch(e){document.getElementById('notice').textContent=e.message}}refresh();setInterval(refresh,3000);
</script></html>
